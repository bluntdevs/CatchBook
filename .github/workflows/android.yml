name: Android-app bouwen

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Controleer de ondertekeningssleutel
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::De geheimen ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD en ANDROID_KEY_ALIAS ontbreken (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Capacitor installeren
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest

      - name: Android-project aanmaken
        run: npx cap add android

      - name: Rechten en versienummer
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          VN=$(node -p "require('./package.json').version")
          echo "VN=$VN" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          grep -nE "versionCode|versionName|applicationId" android/app/build.gradle
          grep -n "permission" "$M"

      - name: Iconen
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#1f6f5c' --iconBackgroundColorDark '#1f6f5c' --splashBackgroundColor '#1f6f5c' --splashBackgroundColorDark '#1f6f5c'

      - name: Web-app kopiëren
        run: npx cap sync android

      - name: Apk bouwen en ondertekenen
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CatchBook.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: CatchBook-${{ env.VN }}-build${{ github.run_number }}
          path: CatchBook.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}-build${{ github.run_number }}
          name: CatchBook ${{ env.VN }} (build ${{ github.run_number }})
          files: CatchBook.apk
          make_latest: true
          body: |
            Nieuwe Android-versie van CatchBook.
            Download **CatchBook.apk** hieronder en installeer ze over de vorige versie heen. Je gegevens blijven bewaard.
